<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-dooo Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-dooo</h1>
      <p class="subtitle" id="today"></p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-title" type="text" placeholder="What do you need to do?" required maxlength="200">
      <div class="form-row">
        <input id="task-date" type="date" aria-label="Due date">
        <select id="task-priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add task</button>
      </div>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="today">Today</button>
      <button type="button" data-filter="upcoming">Upcoming</button>
      <button type="button" data-filter="done">Done</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks here. Add one above.</p>

    <footer class="app-footer">
      <span id="count"></span>
      <button type="button" id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
